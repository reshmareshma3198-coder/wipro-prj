<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlacementPro - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-left">
            <div class="big-logo">💼</div>

            <h1>PlacementPro</h1>

            <p>
                Prepare today.<br>
                Get placed tomorrow. 🚀
            </p>

            <div class="login-features">
                <span>🧮 Aptitude Practice</span>
                <span>💻 Coding Practice</span>
                <span>🗣️ GD Practice</span>
                <span>👔 HR Preparation</span>
            </div>
        </div>


        <div class="login-box">

            <div class="login-icon">👤</div>

            <h2>Welcome Back!</h2>

            <p class="login-subtitle">
                Login to your PlacementPro account
            </p>

            <label>Username</label>

            <input
                type="text"
                id="loginUsername"
                placeholder="Enter Username"
            >

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter Password"
            >

            <button class="login-submit" onclick="loginUser()">
                Login →
            </button>

            <p id="loginMessage"></p>

            <p class="demo-login">
                Demo: <b>student</b> / <b>1234</b>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
